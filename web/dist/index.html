<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piper TTS</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
      .container > div {
        margin-bottom: 4em;
      }
      h2 {
        margin-bottom: .5em;
      }
      td {
        vertical-align: middle;
      }
      .link {
        color: blue;
        text-decoration: underline;
        cursor: pointer;
      }
      .muted-link {
        text-decoration: none;
      }
      .muted-link:hover {
        text-decoration: underline;
      }
      .tip {
        position: relative;
        text-decoration: underline dotted;
        cursor: help;
      }
      .tip:hover::after {
        content: attr(data-tip);
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 4px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #333;
        color: #fff;
        font-size: .8rem;
        font-weight: normal;
        white-space: nowrap;
        z-index: 10;
        pointer-events: none;
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        if (location.hostname != "localhost") {
          navigator.serviceWorker.register("./sw.js")
        } else {
          //Any app served from this origin may have left a worker behind; remove it so
          //this page loads fresh files, and reload once if one was serving this page
          navigator.serviceWorker.getRegistrations()
            .then(regs => Promise.all(regs.map(reg => reg.unregister())))
            .then(() => {
              if (navigator.serviceWorker.controller) location.reload()
            })
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="piper_phonemize.js"></script>
    <script src="bundle.js"></script>
  </body>
</html>
